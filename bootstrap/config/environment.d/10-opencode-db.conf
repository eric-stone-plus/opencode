# opencode DB consolidation pin (machine A set 2026-09-29).
# Canonical DB is ~/.local/share/opencode/opencode-main.db regardless of the
# binary's channel. Mechanism: packages/core/src/database/database.ts path() —
# an OPENCODE_DB value that is not :memory: and not absolute joins
# Global.Path.data (~/.local/share/opencode). Relative name == filename.
# Without this pin a fork build names its DB opencode-<channel>.db
# (channel outside {latest,beta,prod}), forking session history.
# Loaded via ~/.config/environment.d/ (systemd user environment generator);
# take effect on next login (or `systemctl --user daemon-reload` + re-login).
OPENCODE_DB=opencode-main.db

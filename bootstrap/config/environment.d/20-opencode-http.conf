# opencode HTTP fan-out (swarm default, 2026-10-15).
# Bun caps in-flight fetch() requests per process at 256 by default. The swarm
# playbook dispatches one subagent per axis, so the cap can bind well below the
# provider's own ceiling (DeepSeek allows 2500 concurrent deepseek-flash
# requests per account). 4096 sits above that ceiling on purpose: the client
# should never be the thing that queues, so the provider's own 429 is the only
# limit a fan-out can meet.
# Mechanism: bun's fetch/bun-install concurrency knob
# (https://bun.com/docs/runtime/env), read by the compiled binary too.
# Loaded via ~/.config/environment.d/ (systemd user environment generator);
# `systemctl --user daemon-reload` publishes it to processes systemd starts
# afterwards (a fresh login does the same, and already-running processes never
# pick it up). The running service additionally pins it with
# `opencode service set env BUN_CONFIG_MAX_HTTP_REQUESTS 4096`, because the
# service keeps the environment of whichever client spawned it — and that pin
# only takes effect on the next spawn, so install.sh restarts the service after
# writing it.
BUN_CONFIG_MAX_HTTP_REQUESTS=4096
